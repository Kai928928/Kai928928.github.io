[build]
  publish = "."

# SPA 回退：vue-router 使用 history 模式时，深链接刷新不会 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 基础安全响应头（可选，增强安全性）
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
